name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: server-and-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/RvtMcp.Tests/RvtMcp.Tests.csproj

      - name: Build server
        run: dotnet build src/server/RvtMcp.Server.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/RvtMcp.Tests/RvtMcp.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Test provider-neutral benchmark
        working-directory: benchmarks
        run: bun test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cria-test-results
          path: tests/RvtMcp.Tests/TestResults/*.trx
          retention-days: 14

  plugin:
    name: plugin-${{ matrix.revit }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit: R22
            project: src/plugin-r22/RvtMcp.Plugin.R22.csproj
          - revit: R23
            project: src/plugin-r23/RvtMcp.Plugin.R23.csproj
          - revit: R24
            project: src/plugin-r24/RvtMcp.Plugin.R24.csproj
          - revit: R25
            project: src/plugin-r25/RvtMcp.Plugin.R25.csproj
          - revit: R26
            project: src/plugin-r26/RvtMcp.Plugin.R26.csproj
          - revit: R27
            project: src/plugin-r27/RvtMcp.Plugin.R27.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build without deploying to Revit
        run: dotnet build ${{ matrix.project }} -c Release --no-restore /p:RvtMcpSkipDeploy=true
